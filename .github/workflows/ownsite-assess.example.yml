# Example workflow — copy/rename to ownsite-assess.yml and set YOUR staging host.
# Do not enable against third-party assets.

name: OwnSite Assess (example)

on:
  workflow_dispatch:

jobs:
  assess:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run OwnSite Assessor
        run: |
          python -m assessor.cli \
            --host staging.example.com \
            --i-am-authorized \
            --port-mode web \
            --output-dir assessor/reports

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ownsite-reports
          path: assessor/reports/
